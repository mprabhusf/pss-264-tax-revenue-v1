# Builds the app and deploys to GitHub Pages (artifact deployment).
#
# In the repo: Settings → Pages → Build and deployment → Source: **GitHub Actions**
# (If you use "Deploy from a branch" with /docs instead, run `npm run build:github-pages`
# locally, commit the docs/ folder, and push — and keep Vite base as /repo-name/.)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build for Pages
        run: npm ci && npm run build:github-pages
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
